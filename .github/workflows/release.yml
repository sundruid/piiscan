name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "${GOOS}" == "windows" ]]; then suffix=".exe"; fi
          mkdir -p dist
          binary="piiscan-${GOOS}-${GOARCH}${suffix}"
          go build -trimpath -ldflags='-s -w' -o "dist/${binary}" .
          if [[ "${GOOS}" == "windows" ]]; then
            (cd dist && zip "../piiscan-${GOOS}-${GOARCH}.zip" "${binary}")
            sha256sum "piiscan-${GOOS}-${GOARCH}.zip" > "piiscan-${GOOS}-${GOARCH}.zip.sha256"
          else
            tar -C dist -czf "piiscan-${GOOS}-${GOARCH}.tar.gz" "${binary}"
            sha256sum "piiscan-${GOOS}-${GOARCH}.tar.gz" > "piiscan-${GOOS}-${GOARCH}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: piiscan-${{ matrix.goos }}-${{ matrix.goarch }}
          path: piiscan-${{ matrix.goos }}-${{ matrix.goarch }}.*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: piiscan-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/piiscan-*
